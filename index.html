<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Market Recap</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            background: #0b1120;
            color: #f8fafc;
            font-size: 11pt;
            line-height: 1.45;
            height: 100%;
            width: 100%;
        }

        .header {
            background: #1e3a5f;
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
            flex-shrink: 0;
        }
        .header-left { display: flex; align-items: baseline; gap: 14px; }
        .header-title { font-size: 17pt; font-weight: 700; color: #f8fafc; letter-spacing: -0.3px; }
        .header-date { font-size: 12pt; color: #94a3b8; }
        .header-timestamp { font-size: 9pt; color: #64748b; }
        .header-right { text-align: right; }
        .header-proverb { font-size: 11pt; color: #cbd5e1; font-style: italic; }
        .header-source { font-size: 10pt; color: #64748b; }

        .main {
            padding: 16px 24px;
            width: 100%;
        }

        .section {
            background: #1e293b;
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .section-header {
            background: #1e3a5f;
            padding: 7px 12px;
            font-size: 11pt;
            font-weight: 700;
            color: #60a5fa;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        .section-header:hover {
            background: #334155;
        }
        .section-body {
            padding: 10px 14px;
        }
        .collapse-btn {
            font-size: 10pt;
            color: #94a3b8;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: transform 0.2s;
        }
        .collapse-btn:hover {
            color: #f8fafc;
            background: #475569;
        }
        .section.collapsed .section-body {
            display: none;
        }
        .section.collapsed .collapse-btn {
            transform: rotate(-90deg);
        }

        .trend-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #334155;
            font-size: 11pt;
        }
        .trend-row:last-child { border-bottom: none; }
        .trend-yes { color: #22c55e; font-weight: 700; }
        .trend-no { color: #ef4444; font-weight: 700; }
        .regime-box {
            text-align: center;
            padding: 10px;
            margin-top: 6px;
            border-top: 1px solid #334155;
        }
        .regime-label { font-size: 10pt; color: #94a3b8; }
        .regime-value {
            font-size: 22pt;
            font-weight: 800;
            margin: 4px 0;
        }
        .regime-green { color: #22c55e; }
        .regime-yellow { color: #f59e0b; }
        .regime-red { color: #ef4444; }
        .regime-playbook {
            font-size: 9pt;
            color: #64748b;
        }

        .commentary-text {
            font-size: 11pt;
            color: #e2e8f0;
            line-height: 1.6;
        }

        .theme-row {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            font-size: 10pt;
            border-bottom: 1px solid #334155;
        }
        .theme-row:last-child { border-bottom: none; }
        .theme-label { color: #94a3b8; }
        .theme-value { color: #f8fafc; }
        .theme-leader { color: #22c55e; }
        .theme-laggard { color: #ef4444; }

        .gainers-table { width: 100%; font-size: 10pt; border-collapse: collapse; }
        .gainers-table th {
            text-align: left;
            padding: 3px 5px;
            background: #334155;
            color: #94a3b8;
            font-weight: 600;
        }
        .gainers-table td {
            padding: 3px 5px;
            border-bottom: 1px solid #334155;
        }
        .gainers-table tr:last-child td { border-bottom: none; }

        .breadth-stat {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            font-size: 11pt;
        }
        .breadth-input {
            background: #0f172a;
            border: 1px solid #475569;
            color: #f8fafc;
            padding: 3px 8px;
            border-radius: 4px;
            width: 70px;
            font-size: 11pt;
            text-align: right;
        }
        .breadth-input:focus { outline: none; border-color: #60a5fa; }
        .nh-nl-contracting { color: #f59e0b; font-weight: 700; }
        .nh-nl-expanding { color: #22c55e; font-weight: 700; }

        .table-scroll {
            overflow-x: auto;
            width: 100%;
        }
        .data-table {
            width: 100%;
            font-size: 10pt;
            border-collapse: collapse;
            min-width: 500px;
        }
        .data-table thead th {
            background: #1e3a5f;
            color: #94a3b8;
            padding: 5px 8px;
            text-align: right;
            font-weight: 600;
            border-bottom: 1px solid #334155;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }
        .data-table thead th:first-child { text-align: left; }
        .data-table thead th:hover {
            color: #60a5fa;
            background: #334155;
        }
        .data-table thead th .sort-arrow {
            font-size: 8pt;
            margin-left: 3px;
            color: #64748b;
        }
        .data-table thead th.sorted .sort-arrow {
            color: #60a5fa;
        }
        .data-table tbody td {
            padding: 4px 8px;
            border-bottom: 1px solid #334155;
            text-align: right;
            white-space: nowrap;
        }
        .data-table tbody td:first-child {
            text-align: left;
            font-weight: 600;
        }
        .data-table tbody tr:hover { background: #334155; }

        .ticker-link {
            color: #3b82f6;
            text-decoration: none;
            cursor: pointer;
        }
        .ticker-link:hover {
            color: #60a5fa;
            text-decoration: underline;
        }
        .ticker-static {
            color: #e2e8f0;
        }

        .pos { color: #22c55e; }
        .neg { color: #ef4444; }
        .neutral { color: #94a3b8; }
        .above-both { color: #22c55e; font-size: 9pt; }
        .below-both { color: #ef4444; font-size: 9pt; }
        .mixed-trend { color: #f59e0b; font-size: 9pt; }

        .bar-cell {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        .bar-bg {
            position: absolute;
            top: 0;
            height: 100%;
            opacity: 0.15;
            border-radius: 2px;
            z-index: 0;
        }
        .bar-bg.pos { background: #22c55e; left: 0; }
        .bar-bg.neg { background: #ef4444; right: 0; }
        .bar-text {
            position: relative;
            z-index: 1;
        }

        .right-col {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
            overflow: hidden;
        }
        .tables-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .tables-grid .section { margin-bottom: 0; }

        .chart-area {
            background: #1e293b;
            border-radius: 8px;
            border: 1px solid #334155;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .chart-header {
            background: #1e3a5f;
            padding: 7px 12px;
            font-size: 11pt;
            font-weight: 700;
            color: #60a5fa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chart-header span { color: #94a3b8; font-weight: 400; }
        .chart-iframe {
            width: 100%;
            height: 640px;
            border: none;
            background: #0b1120;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
            font-size: 14pt;
        }

        .footer {
            text-align: center;
            padding: 10px;
            font-size: 10pt;
            color: #475569;
            border-top: 1px solid #1e293b;
            flex-shrink: 0;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0b1120; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="header-title">Daily Market Recap</div>
            <div class="header-date" id="header-date">Loading...</div>
            <div class="header-timestamp" id="header-timestamp"></div>
        <div class="header-timestamp" id="data-freshness" style="font-size:8pt;color:#64748b;"></div>
        </div>
        <div class="header-right">
            <div class="header-proverb">"Plan your trade and trade your plan."</div>
            <div class="header-source">- Trading proverb</div>
        </div>
    </div>

    <div class="main" id="main-content">
        <div class="loading">Loading market data...</div>
    </div>

    <div class="footer">
        Data sourced from Yahoo Finance · Click any ticker to view chart · Not financial advice
    </div>

<script>
(function() {
    let snapshot = null;
    let currentChartSymbol = 'SPY';
    let sortState = {};

    function pctColor(v) {
        if (v === null || v === undefined) return 'neutral';
        return v >= 0 ? 'pos' : 'neg';
    }

    function fmtPct(v) {
        if (v === null || v === undefined) return 'N/A';
        const sign = v >= 0 ? '+' : '';
        return sign + v.toFixed(2) + '%';
    }

    function fmtPrice(v) {
        if (v === null || v === undefined) return 'N/A';
        if (v >= 1000) return v.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        if (v >= 1) return v.toFixed(2);
        return v.toFixed(4);
    }

    function trendText(m) {
        if (!m) return '<span class="neutral">N/A</span>';
        if (m.above_ema20 && m.above_sma50) return '<span class="above-both">Above Both</span>';
        if (!m.above_ema20 && !m.above_sma50) return '<span class="below-both">Below Both</span>';
        if (m.above_ema20 && !m.above_sma50) return '<span class="mixed-trend">Above 20 / Below 50</span>';
        return '<span class="mixed-trend">Below 20 / Above 50</span>';
    }

    function tvSymbol(ticker) {
        const map = {
            'BTC-USD': 'BTCUSD',
            'ETH-USD': 'ETHUSD',
            'SOL-USD': 'SOLUSD',
            'ZEC-USD': 'ZECUSD',
            '^TNX': 'US10Y',
            '^FVX': 'US05Y',
            '^IRX': 'US02Y',
        };
        if (map[ticker]) return map[ticker];
        if (ticker.startsWith('^')) return ticker.substring(1);
        return ticker;
    }

    function isClickable(ticker) {
        const clickable = ['SPY','QQQ','DIA','IWM','XLK','XLE','XLU','XLY','XLI','XLC','XLB','XLF','XLP','XLV',
            'SMH','IGV','IHAK','IYZ','IYT','TAN','XHB','XRT','IBB','IYR',
            'BTC-USD','ETH-USD','SOL-USD','ZEC-USD',
            'VIXY','GLD','TLT','^TNX','^FVX','^IRX',
            'ADD','ADDQ',
            'AAPL','MSFT','NVDA','GOOGL','AMZN','META','TSLA','BRK-B','AVGO','JPM','V','WMT','JNJ','XOM',
            'UNH','MA','PG','HD','LLY','CVX','MRK','PEP','ABBV','COST','TMO'];
        return clickable.includes(ticker);
    }

    function tvLink(ticker, label) {
        if (!isClickable(ticker)) {
            return `<span class="ticker-static">${label}</span>`;
        }
        const sym = tvSymbol(ticker);
        return `<span class="ticker-link" onclick="loadChart('${sym}', '${ticker}')" title="Click to view ${ticker} chart">${label}</span>`;
    }

    function barWidth(v, minVal, maxVal) {
        if (v === null || v === undefined) return 0;
        if (minVal >= maxVal) return 0;
        if (v >= 0) {
            if (maxVal <= 0) return 0;
            return Math.min(100, Math.max(0, (v / maxVal) * 100));
        }
        if (minVal >= 0) return 0;
        return Math.min(100, Math.max(0, (Math.abs(v) / Math.abs(minVal)) * 100));
    }

    function renderBar(v, groupRange) {
        if (v === null || v === undefined) return 'N/A';
        const w = barWidth(v, groupRange[0], groupRange[1]);
        const cls = v >= 0 ? 'pos' : 'neg';
        const align = v >= 0 ? 'left:0;' : 'right:0;';
        return `<span class="bar-cell"><span class="bar-bg ${cls}" style="width:${w}%;${align}"></span><span class="bar-text ${cls}">${fmtPct(v)}</span></span>`;
    }

    function renderTrendChecks(checks, yesCount) {
        return checks.map(([label, val]) => `
            <div class="trend-row">
                <span>${label}</span>
                <span class="${val ? 'trend-yes' : 'trend-no'}">${val ? 'YES' : 'NO'}</span>
            </div>
        `).join('');
    }

    function renderRegime(regime) {
        const regimeClass = regime.regime === 'GREEN' ? 'regime-green' : 
                           regime.regime === 'YELLOW' ? 'regime-yellow' : 'regime-red';
        return `
            <div class="regime-box">
                <div class="regime-label">Market Regime (${regime.yes_count}/6 YES):</div>
                <div class="regime-value ${regimeClass}">${regime.regime}</div>
                <div class="regime-playbook">Playbook: ${regime.playbook}</div>
            </div>
        `;
    }

    function renderGainers(gainers) {
        if (!gainers || gainers.length === 0) {
            return '<div style="font-size:10pt;color:#64748b;padding:4px;">No significant movers today.</div>';
        }
        return `
            <table class="gainers-table">
                <thead><tr><th>Ticker</th><th>Name</th><th>% Chg</th></tr></thead>
                <tbody>
                    ${gainers.map(g => `
                        <tr>
                            <td>${tvLink(g.ticker, g.ticker)}</td>
                            <td>${g.name}</td>
                            <td class="${pctColor(g.daily)}">${fmtPct(g.daily)}</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
    }

    function getSortedRows(rows, tableId, cols) {
        const state = sortState[tableId];
        if (!state) return rows;
        const { colKey, asc } = state;
        const sorted = [...rows].sort((a, b) => {
            let av, bv;
            if (colKey === '_name') {
                av = a.ticker;
                bv = b.ticker;
            } else {
                av = a[colKey];
                bv = b[colKey];
            }
            if (av === null || av === undefined) return 1;
            if (bv === null || bv === undefined) return -1;
            if (typeof av === 'string') {
                return asc ? av.localeCompare(bv) : bv.localeCompare(av);
            }
            return asc ? av - bv : bv - av;
        });
        return sorted;
    }

    function renderDataTable(rows, cols, tableId) {
        if (!rows || rows.length === 0) {
            return '<div style="font-size:10pt;color:#64748b;padding:8px;">No data available.</div>';
        }

        const sortedRows = getSortedRows(rows, tableId, cols);

        const ranges = {};
        cols.forEach(col => {
            const vals = rows.map(r => r[col.key]).filter(v => v !== null && v !== undefined);
            if (vals.length > 0) {
                ranges[col.key] = [Math.min(...vals, 0), Math.max(...vals, 0)];
                if (ranges[col.key][0] === ranges[col.key][1]) {
                    ranges[col.key] = [ranges[col.key][0] - 1, ranges[col.key][1] + 1];
                }
            } else {
                ranges[col.key] = [-1, 1];
            }
        });

        const state = sortState[tableId];
        const allCols = [{key: '_name', label: 'Name'}, ...cols];

        return `
            <div class="table-scroll">
                <table class="data-table" id="${tableId}">
                    <thead>
                        <tr>
                            ${allCols.map(c => {
                                const isSorted = state && state.colKey === c.key;
                                const arrow = isSorted ? (state.asc ? '▲' : '▼') : '⇅';
                                return `<th onclick="sortTable('${tableId}', '${c.key}')" class="${isSorted ? 'sorted' : ''}">${c.label}<span class="sort-arrow">${arrow}</span></th>`;
                            }).join('')}
                            <th>Trend</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${sortedRows.map(r => `
                            <tr>
                                <td>${tvLink(r.ticker, r.ticker + ': ' + r.name)}</td>
                                ${cols.map(c => `<td>${renderBar(r[c.key], ranges[c.key])}</td>`).join('')}
                                <td>${trendText(r)}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
    }

    window.sortTable = function(tableId, colKey) {
        const current = sortState[tableId];
        if (current && current.colKey === colKey) {
            sortState[tableId] = { colKey, asc: !current.asc };
        } else {
            sortState[tableId] = { colKey, asc: false };
        }
        renderDashboard();
    };

    window.toggleSection = function(sectionId) {
        const section = document.getElementById(sectionId);
        if (!section) return;
        section.classList.toggle('collapsed');
        const isCollapsed = section.classList.contains('collapsed');
        localStorage.setItem('collapsed-' + sectionId, isCollapsed ? '1' : '0');
    };

    window.applyCollapsedState = function() {
        const sections = ['indexes', 'sectors', 'thematic', 'crypto', 'macro', 'leaders'];
        sections.forEach(id => {
            const section = document.getElementById(id);
            if (section && localStorage.getItem('collapsed-' + id) === '1') {
                section.classList.add('collapsed');
            }
        });
    };

    window.loadChart = function(symbol, originalTicker) {
        currentChartSymbol = symbol;
        const iframe = document.getElementById('tv-chart');
        const headerLabel = document.getElementById('chart-symbol-label');
        if (headerLabel) headerLabel.textContent = originalTicker || symbol;
        if (iframe) {
            iframe.src = `https://www.tradingview.com/widgetembed/?frameElementId=tv-chart&symbol=${symbol}&interval=D&hidesidetoolbar=1&hidetoptoolbar=1&theme=dark&style=1&timezone=America/New_York&withdateranges=1`;
        }
    };

    function renderDashboard() {
        if (!snapshot) return;

        const regime = snapshot.regime || {};
        const commentary = snapshot.commentary || '';
        const gainers = snapshot.top_gainers || [];
        const indexes = snapshot.indexes || {};
        const sectors = snapshot.sectors || [];
        const thematic = snapshot.thematic || [];
        const macro = snapshot.macro || [];
        const crypto = snapshot.crypto || [];
        
        const leaders = snapshot.leaders || [];

        const offSpread = regime.offense_vs_defense || 0;
        const offText = offSpread > 0 ? 
            `<span class="theme-leader">Offense leading (+${offSpread.toFixed(2)}%)</span>` : 
            `<span class="theme-laggard">Defense leading (${offSpread.toFixed(2)}%)</span>`;

        document.getElementById('header-date').textContent = snapshot.market_date || '';

        // Timestamp
        const tsEl = document.getElementById('header-timestamp');
        const freshEl = document.getElementById('data-freshness');
        if (tsEl && snapshot.built_at) {
            const d = new Date(snapshot.built_at);
            tsEl.textContent = 'Updated: ' + d.toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit', timeZoneName: 'short'});
            if (freshEl) {
                const minsAgo = Math.round((Date.now() - d.getTime()) / 60000);
                freshEl.textContent = minsAgo < 60 ? `(${minsAgo}m ago)` : `(${Math.round(minsAgo/60)}h ago)`;
            }
        }

        const html = `
        <div style="display:grid;grid-template-columns:460px 1fr;gap:16px;width:100%;min-width:100%;">

            <!-- LEFT COLUMN -->
            <div>

                <div class="section">
                    <div class="section-header">1. Market Trend</div>
                    <div class="section-body">
                        ${renderTrendChecks(regime.checks || [], regime.yes_count || 0)}
                        ${renderRegime(regime)}
                        ${(() => {
                            const checks = regime.checks || [];
                            const actualYes = checks.filter(([_, v]) => v).length;
                            const statedYes = regime.yes_count || 0;
                            if (actualYes !== statedYes) {
                                return `<div style="margin-top:8px;padding:6px;background:#7f1d1d;border-radius:4px;font-size:9pt;color:#fca5a5;">
                                    ⚠️ Data mismatch: checks show ${actualYes} YES but score says ${statedYes}. 
                                    Please report this bug.
                                </div>`;
                            }
                            return '';
                        })()}
                    </div>
                </div>

                <div class="section">
                    <div class="section-header">Market Commentary</div>
                    <div class="section-body">
                        <div class="commentary-text">${commentary}</div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header">2. Primary Themes</div>
                    <div class="section-body">
                        <div class="theme-row"><span class="theme-label">Rotation (vs SPY)</span><span class="theme-value">${offText}</span></div>
                        <div class="theme-row"><span class="theme-label">Daily:</span><span class="theme-value">Mixed leadership</span></div>
                        <div class="theme-row"><span class="theme-label">Weekly:</span><span class="theme-value">See sector table</span></div>
                        <div style="margin-top:5px;font-size:10pt;color:#94a3b8;">
                            <strong>Focus:</strong> Software M&A, AI Infra, Energy, Crypto, Bond Yields
                        </div>
                        <div style="margin-top:6px;">
                            <div style="font-size:10pt;color:#94a3b8;margin-bottom:3px;"><strong>Top gainers:</strong></div>
                            ${renderGainers(gainers)}
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header">3. Market Breadth (NH-NL)</div>
                    <div class="section-body">
                        <div class="breadth-stat">
                            <span>Cumulative NH-NL trend</span>
                            <span class="nh-nl-contracting" id="nh-nl-trend">CONTRACTING</span>
                        </div>
                        <div class="breadth-stat">
                            <span>New 52-wk highs</span>
                            <span><input type="number" class="breadth-input" id="new-highs" value="" placeholder="0" onchange="updateBreadth()"> (paste TV)</span>
                        </div>
                        <div class="breadth-stat">
                            <span>New 52-wk lows</span>
                            <span><input type="number" class="breadth-input" id="new-lows" value="" placeholder="0" onchange="updateBreadth()"> (paste TV)</span>
                        </div>
                        <div class="breadth-stat">
                            <span>Net NH-NL</span>
                            <span id="nh-nl-net" class="neg">--</span>
                        </div>
                        <div class="breadth-stat">
                            <span>Highs > Lows?</span>
                            <span id="nh-nl-winner" class="trend-no">--</span>
                        </div>
                        <div style="margin-top:8px;border-top:1px solid #334155;padding-top:6px;">

        document.getElementById('main-content').innerHTML = html;

    window.updateBreadth = function() {
        const highs = parseInt(document.getElementById('new-highs')?.value || 0);
        const lows = parseInt(document.getElementById('new-lows')?.value || 0);
        const net = highs - lows;
        const ratio = lows > 0 ? (highs / lows).toFixed(2) : 'N/A';

        const netEl = document.getElementById('nh-nl-net');
        const winnerEl = document.getElementById('nh-nl-winner');
        const trendEl = document.getElementById('nh-nl-trend');

        if (netEl) {
            netEl.textContent = `${net >= 0 ? '+' : ''}${net} · ${ratio}`;
            netEl.className = net >= 0 ? 'pos' : 'neg';
        }
        if (winnerEl) {
            winnerEl.textContent = highs > lows ? 'YES' : 'NO';
            winnerEl.className = highs > lows ? 'trend-yes' : 'trend-no';
        }
        if (trendEl) {
            trendEl.textContent = net >= 0 ? 'EXPANDING' : 'CONTRACTING';
            trendEl.className = net >= 0 ? 'nh-nl-expanding' : 'nh-nl-contracting';
        }

        // Save to history
        saveBreadthHistory(highs, lows, net);
        const histEl = document.getElementById('breadth-history');
        if (histEl) {
            const history = JSON.parse(localStorage.getItem('breadth_history') || '[]');
            histEl.innerHTML = renderHistoryTable(history, [
                {key: 'highs', label: 'Highs'},
                {key: 'lows', label: 'Lows'},
                {key: 'net', label: 'Net', colorFn: (v) => v >= 0 ? 'color:#22c55e;' : 'color:#ef4444;'}
            ], 'breadth-history');
        }
    };

    window.updateAdvDec = function() {
        const nyse = parseFloat(document.getElementById('add-nyse')?.value);
        const qqq = parseFloat(document.getElementById('add-qqq')?.value);
        const netEl = document.getElementById('add-net');
        const trendEl = document.getElementById('add-trend');

        if (isNaN(nyse) && isNaN(qqq)) {
            if (netEl) netEl.textContent = '--';
            if (trendEl) { trendEl.textContent = '--'; trendEl.className = 'neutral'; }
            return;
        }

        const net = (isNaN(nyse) ? 0 : nyse) + (isNaN(qqq) ? 0 : qqq);

        if (netEl) {
            netEl.textContent = (net >= 0 ? '+' : '') + net.toFixed(0);
            netEl.className = net >= 0 ? 'pos' : 'neg';
        }
        if (trendEl) {
            if (net > 0) { trendEl.textContent = 'EXPANDING'; trendEl.className = 'nh-nl-expanding'; }
            else if (net < 0) { trendEl.textContent = 'CONTRACTING'; trendEl.className = 'nh-nl-contracting'; }
            else { trendEl.textContent = 'NEUTRAL'; trendEl.className = 'neutral'; }
        }
    };

    window.updateT2108 = function() {
        const a = parseFloat(document.getElementById('t2108-a')?.value);
        const b = parseFloat(document.getElementById('t2108-b')?.value);
        const resultEl = document.getElementById('t2108-result');
        const condEl = document.getElementById('t2108-condition');

        if (isNaN(a) || isNaN(b) || (a + b) === 0) {
            if (resultEl) resultEl.textContent = '--';
            if (condEl) condEl.textContent = '--';
            return;
        }

        const t2108 = (a / (a + b)) * 100;
        const val = t2108.toFixed(1);

        if (resultEl) {
            resultEl.textContent = val + '%';
            if (t2108 >= 70) resultEl.style.color = '#22c55e';
            else if (t2108 <= 20) resultEl.style.color = '#ef4444';
            else resultEl.style.color = '#f59e0b';
        }

        if (condEl) {
            if (t2108 >= 70) { condEl.textContent = 'OVERBOUGHT'; condEl.style.color = '#22c55e'; }
            else if (t2108 <= 20) { condEl.textContent = 'OVERSOLD'; condEl.style.color = '#ef4444'; }
            else { condEl.textContent = 'NEUTRAL'; condEl.style.color = '#f59e0b'; }
        }

        // Save to history
        saveT2108History(a, b, parseFloat(val));
        const histEl = document.getElementById('t2108-history');
        if (histEl) {
            const history = JSON.parse(localStorage.getItem('t2108_history') || '[]');
            histEl.innerHTML = renderHistoryTable(history, [
                {key: 'a', label: 'A'},
                {key: 'b', label: 'B'},
                {key: 't2108', label: 'T2108', colorFn: (v) => v >= 70 ? 'color:#22c55e;' : v <= 20 ? 'color:#ef4444;' : 'color:#f59e0b;'}
            ], 't2108-history');
        }
    };

    // ─── HISTORY FUNCTIONS ─────────────────────────────────────────

    function saveT2108History(a, b, t2108) {
        const key = 't2108_history';
        let history = JSON.parse(localStorage.getItem(key) || '[]');
        history.unshift({
            date: new Date().toLocaleDateString('en-US', {month: 'short', day: 'numeric'}),
            time: new Date().toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit'}),
            a: a,
            b: b,
            t2108: t2108
        });
        history = history.slice(0, 20);
        localStorage.setItem(key, JSON.stringify(history));
    }

    function saveBreadthHistory(highs, lows, net) {
        const key = 'breadth_history';
        let history = JSON.parse(localStorage.getItem(key) || '[]');
        history.unshift({
            date: new Date().toLocaleDateString('en-US', {month: 'short', day: 'numeric'}),
            time: new Date().toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit'}),
            highs: highs,
            lows: lows,
            net: net
        });
        history = history.slice(0, 20);
        localStorage.setItem(key, JSON.stringify(history));
    }

    function renderHistoryTable(history, columns, containerId) {
        if (!history || history.length === 0) {
            return '<div style="font-size:9pt;color:#64748b;padding:4px;">No history yet.</div>';
        }
        return `
            <table style="width:100%;font-size:9pt;border-collapse:collapse;margin-top:6px;">
                <thead>
                    <tr style="color:#94a3b8;border-bottom:1px solid #334155;">
                        <th style="text-align:left;padding:2px 4px;">Date</th>
                        ${columns.map(c => `<th style="text-align:right;padding:2px 4px;">${c.label}</th>`).join('')}
                    </tr>
                </thead>
                <tbody>
                    ${history.slice(0, 10).map(h => `
                        <tr style="border-bottom:1px solid #1e293b;">
                            <td style="padding:2px 4px;color:#94a3b8;">${h.date} ${h.time}</td>
                            ${columns.map(c => `<td style="text-align:right;padding:2px 4px;${c.colorFn ? c.colorFn(h[c.key]) : ''}">${h[c.key]}</td>`).join('')}
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
    }

    function updateEmotionalAnalysis() {
        if (!snapshot) return;

        const proxyEl = document.getElementById('t2108-proxy-value');
        if (proxyEl && snapshot.t2108_proxy) {
            const p = snapshot.t2108_proxy;
            const sign = p.daily >= 0 ? '+' : '';
            proxyEl.innerHTML = `${p.value}% <span style="font-size:9pt;color:${p.daily >= 0 ? '#22c55e' : '#ef4444'}">(${sign}${p.daily}%)</span>`;
        } else if (proxyEl) {
            proxyEl.textContent = 'N/A';
        }

        const vix = snapshot.macro?.find(m => m.ticker === 'VIXY');
        const tnx = snapshot.macro?.find(m => m.ticker === '^TNX');

        if (vix) {
            const vixEl = document.getElementById('vix-level');
            const vixChgEl = document.getElementById('vix-change');
            if (vixEl) vixEl.textContent = vix.close ? vix.close.toFixed(2) : '--';
            if (vixChgEl && vix.daily !== undefined) {
                vixChgEl.textContent = fmtPct(vix.daily);
                vixChgEl.className = pctColor(vix.daily);
            }
        }
        if (tnx) {
            const yieldEl = document.getElementById('yield-10y');
            if (yieldEl) yieldEl.textContent = tnx.close ? tnx.close.toFixed(2) + '%' : '--';
        }

        const fgEl = document.getElementById('fear-greed');
        if (fgEl && snapshot.regime) {
            const r = snapshot.regime.regime;
            const vixVal = vix?.close || 20;
            if (r === 'GREEN' && vixVal < 20) fgEl.textContent = 'Greed';
            else if (r === 'RED' || vixVal > 25) fgEl.textContent = 'Fear';
            else fgEl.textContent = 'Neutral';
        }
    }

    function loadData() {
        // Cache-bust to always get fresh data after workflow runs
        fetch('data/snapshot.json?t=' + Date.now())
            .then(r => r.ok ? r.json() : null)
            .then(data => {
                if (data) {
                    snapshot = data;
                    renderDashboard();
                } else {
                    document.getElementById('main-content').innerHTML = 
                        '<div class="loading">No data found. Run: python scripts/build_data.py --out-dir data</div>';
                }
            })
            .catch(err => {
                document.getElementById('main-content').innerHTML = 
                    '<div class="loading">Error loading data. Make sure data/snapshot.json exists.</div>';
            });
    }

    // Expose snapshot for console debugging
    window.getSnapshot = function() { return snapshot; };

    loadData();
})();
</script>
