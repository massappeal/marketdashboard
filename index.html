<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Market Recap</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0e1a;
            color: #e2e8f0;
            font-size: 12px;
            line-height: 1.4;
            min-width: 1400px;
            overflow-x: auto;
        }

        /* Header */
        .header {
            background: #1e3a5f;
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
        }
        .header-left { display: flex; align-items: baseline; gap: 12px; }
        .header-title { font-size: 15px; font-weight: 700; color: #f8fafc; }
        .header-date { font-size: 11px; color: #94a3b8; }
        .header-right { text-align: right; }
        .header-proverb { font-size: 10px; color: #cbd5e1; font-style: italic; }
        .header-source { font-size: 9px; color: #64748b; }

        /* Main layout */
        .main {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 12px;
            padding: 12px 20px;
            min-width: 1400px;
        }

        /* Section styling */
        .section {
            background: #111827;
            border-radius: 6px;
            margin-bottom: 10px;
            overflow: hidden;
            border: 1px solid #1e293b;
        }
        .section-header {
            background: #1e293b;
            padding: 5px 10px;
            font-size: 10px;
            font-weight: 700;
            color: #60a5fa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .section-body { padding: 6px 8px; }

        /* Market Trend */
        .trend-row {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px solid #334155;
            font-size: 10px;
        }
        .trend-row:last-child { border-bottom: none; }
        .trend-yes { color: #4ade80; font-weight: 700; }
        .trend-no { color: #f87171; font-weight: 700; }
        .regime-box {
            text-align: center;
            padding: 6px;
            margin-top: 4px;
            border-top: 1px solid #334155;
        }
        .regime-label { font-size: 9px; color: #94a3b8; }
        .regime-value {
            font-size: 16px;
            font-weight: 800;
            margin: 2px 0;
        }
        .regime-green { color: #4ade80; }
        .regime-yellow { color: #fbbf24; }
        .regime-red { color: #f87171; }
        .regime-playbook {
            font-size: 8px;
            color: #64748b;
        }

        /* Commentary */
        .commentary-text {
            font-size: 10px;
            color: #cbd5e1;
            line-height: 1.5;
        }

        /* Themes */
        .theme-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            font-size: 9px;
            border-bottom: 1px solid #334155;
        }
        .theme-row:last-child { border-bottom: none; }
        .theme-label { color: #94a3b8; }
        .theme-value { color: #e2e8f0; }
        .theme-leader { color: #4ade80; }
        .theme-laggard { color: #f87171; }

        /* Gainers table */
        .gainers-table { width: 100%; font-size: 9px; border-collapse: collapse; }
        .gainers-table th {
            text-align: left;
            padding: 2px 4px;
            background: #334155;
            color: #94a3b8;
            font-weight: 600;
        }
        .gainers-table td {
            padding: 2px 4px;
            border-bottom: 1px solid #334155;
        }
        .gainers-table tr:last-child td { border-bottom: none; }

        /* Breadth */
        .breadth-stat {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            font-size: 10px;
        }
        .breadth-input {
            background: #0f172a;
            border: 1px solid #475569;
            color: #e2e8f0;
            padding: 2px 6px;
            border-radius: 3px;
            width: 60px;
            font-size: 10px;
            text-align: right;
        }
        .breadth-input:focus { outline: none; border-color: #60a5fa; }
        .nh-nl-contracting { color: #fbbf24; font-weight: 700; }
        .nh-nl-expanding { color: #4ade80; font-weight: 700; }

        /* Data tables */
        .data-table {
            width: 100%;
            font-size: 9px;
            border-collapse: collapse;
        }
        .data-table thead th {
            background: #1e3a5f;
            color: #94a3b8;
            padding: 4px 5px;
            text-align: right;
            font-weight: 600;
            border-bottom: 1px solid #334155;
            white-space: nowrap;
        }
        .data-table thead th:first-child { text-align: left; }
        .data-table tbody td {
            padding: 3px 5px;
            border-bottom: 1px solid #1e293b;
            text-align: right;
            white-space: nowrap;
        }
        .data-table tbody td:first-child {
            text-align: left;
            font-weight: 600;
        }
        .data-table tbody tr:hover { background: #1e293b; }

        /* Clickable ticker links */
        .ticker-link {
            color: #60a5fa;
            text-decoration: none;
            cursor: pointer;
        }
        .ticker-link:hover {
            color: #93c5fd;
            text-decoration: underline;
        }

        /* Color coding */
        .pos { color: #4ade80; }
        .neg { color: #f87171; }
        .neutral { color: #94a3b8; }
        .above-both { color: #4ade80; font-size: 8px; }
        .below-both { color: #f87171; font-size: 8px; }
        .mixed-trend { color: #fbbf24; font-size: 8px; }

        /* Bar visualization */
        .bar-cell {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        .bar-bg {
            position: absolute;
            top: 0;
            height: 100%;
            opacity: 0.12;
            border-radius: 2px;
            z-index: 0;
        }
        .bar-bg.pos { background: #4ade80; left: 0; }
        .bar-bg.neg { background: #f87171; right: 0; }
        .bar-text {
            position: relative;
            z-index: 1;
        }

        /* Right column layout */
        .right-col {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .tables-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .tables-grid .section { margin-bottom: 0; }

        /* Chart iframe */
        .chart-area {
            background: #111827;
            border-radius: 6px;
            border: 1px solid #1e293b;
            overflow: hidden;
        }
        .chart-header {
            background: #1e293b;
            padding: 5px 10px;
            font-size: 10px;
            font-weight: 700;
            color: #60a5fa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chart-header span { color: #94a3b8; font-weight: 400; }
        .chart-iframe {
            width: 100%;
            height: 480px;
            border: none;
            background: #0a0e1a;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
            font-size: 14px;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 8px;
            font-size: 9px;
            color: #475569;
            border-top: 1px solid #1e293b;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #0a0e1a; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="header-title">Daily Market Recap</div>
            <div class="header-date" id="header-date">Loading...</div>
        </div>
        <div class="header-right">
            <div class="header-proverb">"Plan your trade and trade your plan."</div>
            <div class="header-source">- Trading proverb</div>
        </div>
    </div>

    <div class="main" id="main-content">
        <div class="loading">Loading market data...</div>
    </div>

    <div class="footer">
        Data sourced from Yahoo Finance · Click any ticker to view chart · Not financial advice
    </div>

<script>
(function() {
    let snapshot = null;
    let currentChartSymbol = 'SPY';

    function pctColor(v) {
        if (v === null || v === undefined) return 'neutral';
        return v >= 0 ? 'pos' : 'neg';
    }

    function fmtPct(v) {
        if (v === null || v === undefined) return 'N/A';
        const sign = v >= 0 ? '+' : '';
        return sign + v.toFixed(2) + '%';
    }

    function trendText(m) {
        if (!m) return '<span class="neutral">N/A</span>';
        if (m.above_ema20 && m.above_sma50) return '<span class="above-both">Above Both</span>';
        if (!m.above_ema20 && !m.above_sma50) return '<span class="below-both">Below Both</span>';
        if (m.above_ema20 && !m.above_sma50) return '<span class="mixed-trend">Above 20 / Below 50</span>';
        return '<span class="mixed-trend">Below 20 / Above 50</span>';
    }

    function tvSymbol(ticker) {
        let s = ticker;
        if (ticker.startsWith('^')) s = ticker.substring(1);
        if (ticker === 'BTC-USD') s = 'BTCUSD';
        if (ticker === 'ETH-USD') s = 'ETHUSD';
        if (ticker === 'SOL-USD') s = 'SOLUSD';
        if (ticker === 'ZEC-USD') s = 'ZECUSD';
        return s;
    }

    function tvLink(ticker, label) {
        const sym = tvSymbol(ticker);
        return `<span class="ticker-link" onclick="loadChart('${sym}', '${ticker}')" title="Click to view ${ticker} chart">${label}</span>`;
    }

    function barWidth(v, minVal, maxVal) {
        if (v === null || v === undefined) return 0;
        if (minVal >= maxVal) return 0;
        if (v >= 0) {
            if (maxVal <= 0) return 0;
            return Math.min(100, Math.max(0, (v / maxVal) * 100));
        }
        if (minVal >= 0) return 0;
        return Math.min(100, Math.max(0, (Math.abs(v) / Math.abs(minVal)) * 100));
    }

    function renderBar(v, groupRange) {
        if (v === null || v === undefined) return 'N/A';
        const w = barWidth(v, groupRange[0], groupRange[1]);
        const cls = v >= 0 ? 'pos' : 'neg';
        const align = v >= 0 ? 'left:0;' : 'right:0;';
        return `<span class="bar-cell"><span class="bar-bg ${cls}" style="width:${w}%;${align}"></span><span class="bar-text ${cls}">${fmtPct(v)}</span></span>`;
    }

    function renderTrendChecks(checks, yesCount) {
        return checks.map(([label, val]) => `
            <div class="trend-row">
                <span>${label}</span>
                <span class="${val ? 'trend-yes' : 'trend-no'}">${val ? 'YES' : 'NO'}</span>
            </div>
        `).join('');
    }

    function renderRegime(regime) {
        const regimeClass = regime.regime === 'GREEN' ? 'regime-green' : 
                           regime.regime === 'YELLOW' ? 'regime-yellow' : 'regime-red';
        return `
            <div class="regime-box">
                <div class="regime-label">Market Regime (${regime.yes_count}/6 YES):</div>
                <div class="regime-value ${regimeClass}">${regime.regime}</div>
                <div class="regime-playbook">Playbook: ${regime.playbook}</div>
            </div>
        `;
    }

    function renderGainers(gainers) {
        if (!gainers || gainers.length === 0) {
            return '<div style="font-size:9px;color:#64748b;padding:3px;">No significant movers today.</div>';
        }
        return `
            <table class="gainers-table">
                <thead><tr><th>Ticker</th><th>Name</th><th>% Chg</th></tr></thead>
                <tbody>
                    ${gainers.map(g => `
                        <tr>
                            <td>${tvLink(g.ticker, g.ticker)}</td>
                            <td>${g.name}</td>
                            <td class="${pctColor(g.daily)}">${fmtPct(g.daily)}</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
    }

    function renderDataTable(rows, cols) {
        const ranges = {};
        cols.forEach(col => {
            const vals = rows.map(r => r[col.key]).filter(v => v !== null && v !== undefined);
            ranges[col.key] = [Math.min(...vals, 0), Math.max(...vals, 0)];
            if (ranges[col.key][0] === ranges[col.key][1]) {
                ranges[col.key] = [ranges[col.key][0] - 1, ranges[col.key][1] + 1];
            }
        });

        return `
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        ${cols.map(c => `<th>${c.label}</th>`).join('')}
                        <th>Trend</th>
                    </tr>
                </thead>
                <tbody>
                    ${rows.map(r => `
                        <tr>
                            <td>${tvLink(r.ticker, r.ticker + ': ' + r.name)}</td>
                            ${cols.map(c => `<td>${renderBar(r[c.key], ranges[c.key])}</td>`).join('')}
                            <td>${trendText(r)}</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
    }

    window.loadChart = function(symbol, originalTicker) {
        currentChartSymbol = symbol;
        const iframe = document.getElementById('tv-chart');
        const headerLabel = document.getElementById('chart-symbol-label');
        if (headerLabel) headerLabel.textContent = originalTicker || symbol;
        if (iframe) {
            iframe.src = `https://www.tradingview.com/widgetembed/?frameElementId=tv-chart&symbol=${symbol}&interval=D&hidesidetoolbar=1&hidetoptoolbar=1&theme=dark&style=1&timezone=America/New_York&withdateranges=1`;
        }
    };

    function renderDashboard() {
        if (!snapshot) return;

        const regime = snapshot.regime || {};
        const commentary = snapshot.commentary || '';
        const gainers = snapshot.top_gainers || [];
        const indexes = snapshot.indexes || {};
        const sectors = snapshot.sectors || [];
        const thematic = snapshot.thematic || [];
        const macro = snapshot.macro || [];
        const crypto = snapshot.crypto || [];

        const offSpread = regime.offense_vs_defense || 0;
        const offText = offSpread > 0 ? 
            `<span class="theme-leader">Offense leading (+${offSpread.toFixed(2)}%)</span>` : 
            `<span class="theme-laggard">Defense leading (${offSpread.toFixed(2)}%)</span>`;

        document.getElementById('header-date').textContent = snapshot.market_date || '';

        const html = `
        <div style="display:grid;grid-template-columns:340px 1fr;gap:12px;">

            <!-- LEFT COLUMN -->
            <div>

                <div class="section">
                    <div class="section-header">1. Market Trend</div>
                    <div class="section-body">
                        ${renderTrendChecks(regime.checks || [], regime.yes_count || 0)}
                        ${renderRegime(regime)}
                    </div>
                </div>

                <div class="section">
                    <div class="section-header">Market Commentary</div>
                    <div class="section-body">
                        <div class="commentary-text">${commentary}</div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header">2. Primary Themes</div>
                    <div class="section-body">
                        <div class="theme-row"><span class="theme-label">Rotation (vs SPY)</span><span class="theme-value">${offText}</span></div>
                        <div class="theme-row"><span class="theme-label">Daily:</span><span class="theme-value">Mixed leadership</span></div>
                        <div class="theme-row"><span class="theme-label">Weekly:</span><span class="theme-value">See sector table</span></div>
                        <div style="margin-top:5px;font-size:9px;color:#94a3b8;">
                            <strong>Focus:</strong> Software M&A, AI Infra, Energy, Crypto, Bond Yields
                        </div>
                        <div style="margin-top:6px;">
                            <div style="font-size:9px;color:#94a3b8;margin-bottom:3px;"><strong>Top gainers:</strong></div>
                            ${renderGainers(gainers)}
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header">3. Market Breadth (NH-NL)</div>
                    <div class="section-body">
                        <div class="breadth-stat">
                            <span>Cumulative NH-NL trend</span>
                            <span class="nh-nl-contracting" id="nh-nl-trend">CONTRACTING</span>
                        </div>
                        <div class="breadth-stat">
                            <span>New 52-wk highs</span>
                            <span><input type="number" class="breadth-input" id="new-highs" value="" placeholder="0" onchange="updateBreadth()"> (paste TV)</span>
                        </div>
                        <div class="breadth-stat">
                            <span>New 52-wk lows</span>
                            <span><input type="number" class="breadth-input" id="new-lows" value="" placeholder="0" onchange="updateBreadth()"> (paste TV)</span>
                        </div>
                        <div class="breadth-stat">
                            <span>Net NH-NL</span>
                            <span id="nh-nl-net" class="neg">--</span>
                        </div>
                        <div class="breadth-stat">
                            <span>Highs > Lows?</span>
                            <span id="nh-nl-winner" class="trend-no">--</span>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header">T2108 / % Above 40DSMA</div>
                    <div class="section-body">
                        <div style="font-size:9px;color:#94a3b8;margin-bottom:4px;">
                            <strong>Proxy ($SPXA50R):</strong>
                            <span id="t2108-proxy-value" style="color:#cbd5e1;">--</span>
                        </div>
                        <div style="border-top:1px solid #334155;margin:4px 0;padding-top:4px;">
                            <div style="font-size:9px;color:#94a3b8;margin-bottom:3px;"><strong>Manual T2108:</strong></div>
                            <div class="breadth-stat">
                                <span>A: Above 40DSMA</span>
                                <span><input type="number" class="breadth-input" id="t2108-a" value="" placeholder="0" onchange="updateT2108()"></span>
                            </div>
                            <div class="breadth-stat">
                                <span>B: Below 40DSMA</span>
                                <span><input type="number" class="breadth-input" id="t2108-b" value="" placeholder="0" onchange="updateT2108()"></span>
                            </div>
                            <div class="breadth-stat" style="margin-top:3px;">
                                <span><strong>T2108 = A/(A+B)×100</strong></span>
                                <span id="t2108-result" style="font-size:13px;font-weight:700;color:#94a3b8;">--</span>
                            </div>
                            <div class="breadth-stat">
                                <span>Condition</span>
                                <span id="t2108-condition" style="font-size:9px;font-weight:600;">--</span>
                            </div>
                            <div style="margin-top:3px;font-size:8px;color:#64748b;">
                                &lt;20% = Oversold · 20-70% = Neutral · &gt;70% = Overbought
                            </div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header">4. Situational Awareness</div>
                    <div class="section-body">
                        <div style="font-size:9px;color:#94a3b8;margin-bottom:3px;">Upcoming macro (next 7 days):</div>
                        <div style="font-size:9px;color:#cbd5e1;line-height:1.5;" id="econ-calendar">
                            <div style="padding:2px 0;border-bottom:1px solid #334155;"><span style="color:#fbbf24;">Mon Oct 13</span> · No major events</div>
                            <div style="padding:2px 0;border-bottom:1px solid #334155;"><span style="color:#fbbf24;">Tue Oct 14</span> · PPI, NFIB</div>
                            <div style="padding:2px 0;border-bottom:1px solid #334155;"><span style="color:#fbbf24;">Wed Oct 15</span> · CPI, FOMC Minutes</div>
                            <div style="padding:2px 0;"><span style="color:#fbbf24;">Thu Oct 16</span> · Jobless Claims, Retail Sales</div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header">5. Emotional Analysis</div>
                    <div class="section-body">
                        <div class="breadth-stat"><span>VIX</span><span id="vix-level" class="neutral">--</span></div>
                        <div class="breadth-stat"><span>VIX vs 5D</span><span id="vix-change" class="neutral">--</span></div>
                        <div class="breadth-stat"><span>10Y Yield</span><span id="yield-10y" class="neutral">--</span></div>
                        <div style="margin-top:4px;font-size:9px;color:#94a3b8;">Fear/Greed: <span id="fear-greed">Neutral</span></div>
                    </div>
                </div>

            </div>

            <!-- RIGHT COLUMN -->
            <div class="right-col">

                <!-- Major Indexes -->
                <div class="section">
                    <div class="section-header">Major Indexes</div>
                    <div class="section-body" style="padding:0;">
                        ${renderDataTable(
                            Object.entries(indexes).map(([t, m]) => ({ticker: t, name: m.name || t, ...m})),
                            [
                                {key: 'daily', label: '% Daily'},
                                {key: 'p5d', label: '% 5D'},
                                {key: 'off_high', label: '% Off High'},
                                {key: 'ytd', label: '% YTD'},
                            ]
                        )}
                    </div>
                </div>

                <!-- 2x2 Grid: Sectors | Thematic -->
                <div class="tables-grid">
                    <div class="section">
                        <div class="section-header">S&P 500 Sectors</div>
                        <div class="section-body" style="padding:0;">
                            ${renderDataTable(sectors, [
                                {key: 'daily', label: '% Daily'},
                                {key: 'p5d', label: '% 5D'},
                                {key: 'off_high', label: '% Off High'},
                                {key: 'ytd', label: '% YTD'},
                            ])}
                        </div>
                    </div>
                    <div class="section">
                        <div class="section-header">Thematic ETFs</div>
                        <div class="section-body" style="padding:0;">
                            ${renderDataTable(thematic, [
                                {key: 'daily', label: '% Daily'},
                                {key: 'p5d', label: '% 5D'},
                                {key: 'off_high', label: '% Off High'},
                                {key: 'ytd', label: '% YTD'},
                            ])}
                        </div>
                    </div>
                </div>

                <!-- 2x2 Grid: Crypto | Macro -->
                <div class="tables-grid">
                    <div class="section">
                        <div class="section-header">Crypto</div>
                        <div class="section-body" style="padding:0;">
                            ${renderDataTable(crypto, [
                                {key: 'daily', label: '% Daily'},
                                {key: 'p5d', label: '% 5D'},
                                {key: 'off_high', label: '% Off High'},
                                {key: 'ytd', label: '% YTD'},
                            ])}
                        </div>
                    </div>
                    <div class="section">
                        <div class="section-header">Macro</div>
                        <div class="section-body" style="padding:0;">
                            ${renderDataTable(macro, [
                                {key: 'daily', label: '% Daily'},
                                {key: 'p5d', label: '% 5D'},
                                {key: 'off_high', label: '% Off High'},
                                {key: 'ytd', label: '% YTD'},
                            ])}
                        </div>
                    </div>
                </div>

                <!-- Chart Iframe -->
                <div class="chart-area">
                    <div class="chart-header">
                        <span>TradingView Chart: <span id="chart-symbol-label">SPY</span></span>
                        <span style="font-size:9px;color:#64748b;">Click any ticker above to change</span>
                    </div>
                    <iframe id="tv-chart" class="chart-iframe"
                        src="https://www.tradingview.com/widgetembed/?frameElementId=tv-chart&symbol=SPY&interval=D&hidesidetoolbar=1&hidetoptoolbar=1&theme=dark&style=1&timezone=America/New_York&withdateranges=1"
                        allowfullscreen>
                    </iframe>
                </div>

            </div>
        </div>
        `;

        document.getElementById('main-content').innerHTML = html;

        updateBreadth();
        updateT2108();
        updateEmotionalAnalysis();
    }

    window.updateBreadth = function() {
        const highs = parseInt(document.getElementById('new-highs')?.value || 0);
        const lows = parseInt(document.getElementById('new-lows')?.value || 0);
        const net = highs - lows;
        const ratio = lows > 0 ? (highs / lows).toFixed(2) : 'N/A';

        const netEl = document.getElementById('nh-nl-net');
        const winnerEl = document.getElementById('nh-nl-winner');
        const trendEl = document.getElementById('nh-nl-trend');

        if (netEl) {
            netEl.textContent = `${net >= 0 ? '+' : ''}${net} · ${ratio}`;
            netEl.className = net >= 0 ? 'pos' : 'neg';
        }
        if (winnerEl) {
            winnerEl.textContent = highs > lows ? 'YES' : 'NO';
            winnerEl.className = highs > lows ? 'trend-yes' : 'trend-no';
        }
        if (trendEl) {
            trendEl.textContent = net >= 0 ? 'EXPANDING' : 'CONTRACTING';
            trendEl.className = net >= 0 ? 'nh-nl-expanding' : 'nh-nl-contracting';
        }
    };

    window.updateT2108 = function() {
        const a = parseFloat(document.getElementById('t2108-a')?.value);
        const b = parseFloat(document.getElementById('t2108-b')?.value);
        const resultEl = document.getElementById('t2108-result');
        const condEl = document.getElementById('t2108-condition');

        if (isNaN(a) || isNaN(b) || (a + b) === 0) {
            if (resultEl) resultEl.textContent = '--';
            if (condEl) condEl.textContent = '--';
            return;
        }

        const t2108 = (a / (a + b)) * 100;
        const val = t2108.toFixed(1);

        if (resultEl) {
            resultEl.textContent = val + '%';
            if (t2108 >= 70) resultEl.style.color = '#4ade80';
            else if (t2108 <= 20) resultEl.style.color = '#f87171';
            else resultEl.style.color = '#fbbf24';
        }

        if (condEl) {
            if (t2108 >= 70) { condEl.textContent = 'OVERBOUGHT'; condEl.style.color = '#4ade80'; }
            else if (t2108 <= 20) { condEl.textContent = 'OVERSOLD'; condEl.style.color = '#f87171'; }
            else { condEl.textContent = 'NEUTRAL'; condEl.style.color = '#fbbf24'; }
        }
    };

    function updateEmotionalAnalysis() {
        if (!snapshot) return;

        const proxyEl = document.getElementById('t2108-proxy-value');
        if (proxyEl && snapshot.t2108_proxy) {
            const p = snapshot.t2108_proxy;
            const sign = p.daily >= 0 ? '+' : '';
            proxyEl.innerHTML = `${p.value}% <span style="font-size:8px;color:${p.daily >= 0 ? '#4ade80' : '#f87171'}">(${sign}${p.daily}%)</span>`;
        } else if (proxyEl) {
            proxyEl.textContent = 'N/A';
        }

        const vix = snapshot.macro?.find(m => m.ticker === 'VIXY');
        const tnx = snapshot.macro?.find(m => m.ticker === '^TNX');

        if (vix) {
            const vixEl = document.getElementById('vix-level');
            const vixChgEl = document.getElementById('vix-change');
            if (vixEl) vixEl.textContent = vix.close ? vix.close.toFixed(2) : '--';
            if (vixChgEl && vix.daily !== undefined) {
                vixChgEl.textContent = fmtPct(vix.daily);
                vixChgEl.className = pctColor(vix.daily);
            }
        }
        if (tnx) {
            const yieldEl = document.getElementById('yield-10y');
            if (yieldEl) yieldEl.textContent = tnx.close ? tnx.close.toFixed(2) + '%' : '--';
        }

        const fgEl = document.getElementById('fear-greed');
        if (fgEl && snapshot.regime) {
            const r = snapshot.regime.regime;
            const vixVal = vix?.close || 20;
            if (r === 'GREEN' && vixVal < 20) fgEl.textContent = 'Greed';
            else if (r === 'RED' || vixVal > 25) fgEl.textContent = 'Fear';
            else fgEl.textContent = 'Neutral';
        }
    }

    function loadData() {
        fetch('data/snapshot.json')
            .then(r => r.ok ? r.json() : null)
            .then(data => {
                if (data) {
                    snapshot = data;
                    renderDashboard();
                } else {
                    document.getElementById('main-content').innerHTML = 
                        '<div class="loading">No data found. Run: python scripts/build_data.py --out-dir data</div>';
                }
            })
            .catch(err => {
                document.getElementById('main-content').innerHTML = 
                    '<div class="loading">Error loading data. Make sure data/snapshot.json exists.</div>';
            });
    }

    loadData();
})();
</script>
</body>
</html>
